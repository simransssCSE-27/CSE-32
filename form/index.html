<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-header">
        <h1>Employee Registration</h1>
        <p>Please enter your details carefully</p>
    </div>

    <form id="employeeForm">

        <!-- Employee Information -->
        <div class="section">
            <h2>Employee Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Employee ID <span>*</span></label>
                    <input
                        type="text"
                        id="employeeId"
                        placeholder="EMP1001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>First Name <span>*</span></label>
                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Last Name <span>*</span></label>
                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Date of Birth <span>*</span></label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender <span>*</span></label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address <span>*</span></label>
                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

            </div>
        </div>


        <!-- Employment Details -->
        <div class="section">

            <h2>Employment Details</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Department <span>*</span></label>

                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option>Human Resources</option>
                        <option>Information Technology</option>
                        <option>Finance</option>
                        <option>Marketing</option>
                        <option>Sales</option>
                        <option>Operations</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Designation <span>*</span></label>

                    <input
                        type="text"
                        id="designation"
                        placeholder="Software Engineer"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Employment Type <span>*</span></label>

                    <select id="employmentType" required>
                        <option value="">Select Type</option>
                        <option>Full Time</option>
                        <option>Part Time</option>
                        <option>Intern</option>
                        <option>Contract</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Joining Date <span>*</span></label>

                    <input type="date" id="joiningDate" required>
                </div>

                <div class="form-group">
                    <label>Qualification <span>*</span></label>

                    <select id="qualification" required>
                        <option value="">Select Qualification</option>
                        <option>High School</option>
                        <option>Diploma</option>
                        <option>Bachelor's Degree</option>
                        <option>Master's Degree</option>
                        <option>PhD</option>
                    </select>
                </div>

            </div>

        </div>


        <!-- Contact Details -->
        <div class="section">

            <h2>Contact Details</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Country <span>*</span></label>

                    <select id="country" required>
                        <option value="">Select Country</option>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mobile Number <span>*</span></label>

                    <input
                        type="tel"
                        id="mobile"
                        inputmode="numeric"
                        placeholder="Enter mobile number"
                        maxlength="12"
                        required
                    >

                    <small id="mobileHint">
                        Select country first
                    </small>
                </div>

                <div class="form-group">
                    <label>State / Province</label>

                    <input
                        type="text"
                        id="state"
                        placeholder="Enter state or province"
                    >
                </div>

                <div class="form-group">
                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                    >
                </div>

                <div class="form-group">
                    <label>PIN / ZIP Code</label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter PIN / ZIP"
                        maxlength="6"
                    >
                </div>

            </div>

            <div class="form-group full">
                <label>Full Address <span>*</span></label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter complete address"
                    required
                ></textarea>
            </div>

        </div>


        <!-- Emergency Contact -->
        <div class="section">

            <h2>Emergency Contact</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Contact Person <span>*</span></label>

                    <input
                        type="text"
                        id="emergencyName"
                        placeholder="Enter contact person's name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Relationship <span>*</span></label>

                    <select id="relationship" required>
                        <option value="">Select Relationship</option>
                        <option>Parent</option>
                        <option>Spouse</option>
                        <option>Sibling</option>
                        <option>Friend</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Emergency Contact Number <span>*</span></label>

                    <input
                        type="tel"
                        id="emergencyNumber"
                        inputmode="numeric"
                        maxlength="12"
                        placeholder="Enter contact number"
                        required
                    >
                </div>

            </div>

        </div>


        <!-- Buttons -->
        <div class="button-container">

            <button type="reset" class="reset-btn">
                Reset
            </button>

            <button type="submit" class="submit-btn">
                Register Employee
            </button>

        </div>

    </form>


    <!-- Success Message -->
    <div id="successMessage" class="success-message">
        <div class="success-icon">✓</div>

        <h2>Registration Successful!</h2>

        <p>
            Employee details have been submitted successfully.
        </p>

        <button onclick="location.reload()">
            Register Another Employee
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
